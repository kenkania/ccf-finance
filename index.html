<html>
<style>
textarea {
    width: 800px;
    height: 400px;
    overflow-y: scroll;
    overflow: scroll;
    white-space: pre;
}
.button {
  background-color: #008cba; /* Green */
  border: none;
  color: white;
  padding: 15px 32px;
  text-align: center;
  text-decoration: none;
  display: inline-block;
  font-size: 16px;
  border-radius: 4px;
  user-select: none;
  cursor: pointer;
}
.error-box {
  display: none;
  background-color: #ffebee;
  border: 2px solid #ef5350;
  border-radius: 4px;
  padding: 15px;
  margin: 10px 0;
  color: #c62828;
  font-family: monospace;
  white-space: pre-wrap;
  max-width: 800px;
}
.error-box.visible {
  display: block;
}
</style>
<div>Enter Comma-delimited file content (goto the wells fargo account, then click "Download Account Activity", pick dates, and use Comma delimited):</div>
<textarea id="input"></textarea>
<br/>
<div id="submit" class="button">Transform</div>
<br/>
<div id="error" class="error-box"></div>
<div>Transformed content (copy this into CCF Transactions google sheet and then do "Data" -> "Split Text Into Columns"):</div>
<textarea id="output" readonly>
</textarea>
<script>
const capitalize = (str, lower = true) =>
    (lower ? str.toLowerCase() : str).replace(/(?:^|\s|["'([{])+\S/g, match => match.toUpperCase());

function parseZelle(tx) {
    // Looks for the REF # code
    var refMatch = tx.match(/REF # ?([a-zA-Z0-9]+)/);
    var ref = refMatch ? refMatch[1] : "";
    
    var onMatch = tx.match(/ ON \d\d\/\d\d REF # ?([a-zA-Z0-9]+)/);
    var rcvDate = "";
    
    if (onMatch) {
        rcvDate = tx.match(/ ON (\d\d\/\d\d) REF #/)[1] + '/' + new Date().getFullYear();
    }
    
    // Find the end of the "FROM/TO" section to extract the counterparty
    const directionMatch = tx.match(/FROM|TO/);
    const startIdx = "zelle ".length + (directionMatch ? directionMatch.index + directionMatch[0].length : 0);
    const endIdx = onMatch ? onMatch.index : (refMatch ? refMatch.index : tx.length);
    
    var counterparty = capitalize(tx.substring(startIdx, endIdx).trim());
    var notes = onMatch ? tx.substring(onMatch.index + onMatch[0].length + 1).toLowerCase() : "";

    return {
        method: "zelle",
        ref,
        rcvDate,
        notes,
        counterparty,
    };
}

function parseDescription(tx) {
    var lower = tx.toLowerCase();
    if (lower.startsWith("deposited or cashed check ") || lower.startsWith("check ")) {
        return {
            method: "check",
            ref: lower.split("check # ")[1] || "",
        };
    } else if (lower.startsWith("zelle ")) {
        return parseZelle(tx);
    } else if (lower.includes("tithe.ly")) {
        // Updated regex to handle irregular spaces/tabs between tithe.ly and the ID
        const match = tx.match(/tithe\.ly\s+.*?\*\s*([a-zA-Z0-9-]+)/i);
        return {
            method: "tithely",
            ref: match ? match[1] : "UNKNOWN",
            counterparty: "PFP",
            notes: ""
        };
    } else {
        throw new Error("unknown transaction type: " + tx);
    }
}

function transformRow(cols) {
    // New format: 0: Date, 1: Description, 2: Amount, 3: Check #, 4: Status
    const postDate = cols[0];
    const rawAmount = cols[2];
    
    const credit = rawAmount.startsWith('-') ? "" : '$' + rawAmount;
    const debit = rawAmount.startsWith('-') ? '$' + rawAmount.substring(1) : "";
    
    const custom = parseDescription(cols[1]);

    return [
        postDate, 
        custom.rcvDate || "", 
        custom.method, 
        custom.ref, 
        custom.counterparty || "TODO", 
        credit, 
        debit, 
        custom.notes || ""
    ];
}

function showError(message, lineNumber, lineText, error) {
    console.error("Transform error:", error);
    const errorBox = document.getElementById("error");
    if (errorBox) {
        errorBox.textContent = `Error on line ${lineNumber}: ${message}\n\nLine content: ${lineText}`;
        errorBox.classList.add("visible");
    }
}

function hideError() {
    const errorBox = document.getElementById("error");
    if (errorBox) errorBox.classList.remove("visible");
}

window.onload = () => {
    const submitBtn = document.getElementById("submit");
    if (!submitBtn) return;

    submitBtn.addEventListener("click", () => {
        hideError();
        const input = document.getElementById("input").value;
        if (!input) return;
        
        try {
            const lines = input.split(/\r?\n/);
            const parsedRows = [];
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                // Skip empty lines or CSV header
                if (line.length < 5 || line.includes('"DATE"')) continue;
                
                try {
                    // Splits CSV while handling quoted commas
                    const cols = line.substring(1, line.length - 1).split('","');
                    const transformed = transformRow(cols);
                    parsedRows.push(transformed);
                } catch (err) {
                    showError(err.message, i + 1, line, err);
                    return;
                }
            }
            
            const sorted = parsedRows.sort((a, b) => new Date(a[0]) - new Date(b[0]));
            const result = sorted
                .map(row => row.map(s => '"' + s + '"').join(','))
                .join("\n");
            
            document.getElementById("output").value = result;
        } catch (err) {
            showError(err.message, "unknown", "", err);
        }
    });
};
</script>
</html>
