<html>
<style>
textarea {
    width: 800px;
    height: 400px;
    overflow-y: scroll;
    overflow: scroll;
    white-space: pre;
}
.button {
  background-color: #008cba; /* Green */
  border: none;
  color: white;
  padding: 15px 32px;
  text-align: center;
  text-decoration: none;
  display: inline-block;
  font-size: 16px;
  border-radius: 4px;
  user-select: none;
  cursor: pointer;
}
.error-box {
  display: none;
  background-color: #ffebee;
  border: 2px solid #ef5350;
  border-radius: 4px;
  padding: 15px;
  margin: 10px 0;
  color: #c62828;
  font-family: monospace;
  white-space: pre-wrap;
  max-width: 800px;
}
.error-box.visible {
  display: block;
}
</style>
<div>Enter Comma-delimited file content (goto the wells fargo account, then click "Download Account Activity", pick dates, and use Comma delimited):</div>
<textarea id="input"></textarea>
<br/>
<div id="submit" class="button">Transform</div>
<br/>
<div id="error" class="error-box"></div>
<div>Transformed content (copy this into CCF Transactions google sheet and then do "Data" -> "Split Text Into Columns"):</div>
<textarea id="output" readonly>
</textarea>
<script>
const capitalize = (str, lower = true) =>
    (lower ? str.toLowerCase() : str).replace(/(?:^|\s|["'([{])+\S/g, match => match.toUpperCase());

function parseZelle(tx) {
    // 1. Get Ref # (finds "REF #" then captures the alphanumeric string)
    const refMatch = tx.match(/REF # ?([a-zA-Z0-9]+)/i);
    const ref = refMatch ? refMatch[1] : "";

    // 2. Get Date (finds "ON MM/DD")
    const onMatch = tx.match(/ ON (\d\d\/\d\d)/i);
    const rcvDate = onMatch ? onMatch[1] + '/' + new Date().getFullYear() : "";

    // 3. Get Counterparty & Notes
    // We split at "ON" if it exists, otherwise split at "REF #"
    const splitPoint = onMatch ? onMatch.index : (refMatch ? refMatch.index : tx.length);
    const header = tx.substring(0, splitPoint);
    
    // Counterparty is usually the text between the direction ("FROM"/"TO") and the split point
    const dirMatch = header.match(/(FROM|TO) (.*)/i);
    const counterparty = dirMatch ? capitalize(dirMatch[2].trim()) : "UNKNOWN";

    // Notes are everything after the "REF # XXXXXX"
    let notes = "";
    if (refMatch) {
        notes = tx.substring(refMatch.index + refMatch[0].length).trim();
    }

    return { method: "zelle", ref, rcvDate, notes, counterparty };
}

function parseDescription(tx) {
    const lower = tx.toLowerCase();
    if (lower.startsWith("check ") || lower.startsWith("deposited or cashed check ")) {
        return { method: "check", ref: lower.split("check # ")[1] || "", counterparty: "TODO", notes: "" };
    } else if (lower.startsWith("zelle ")) {
        return parseZelle(tx);
    } else if (lower.includes("tithe.ly")) {
        const parts = tx.split('*');
        return {
            method: "tithely",
            ref: parts.length > 1 ? parts[1].trim().split(' ')[0] : "UNKNOWN",
            counterparty: "PFP",
            notes: ""
        };
    } else {
        throw new Error("unknown transaction type: " + tx);
    }
}

function transformRow(cols) {
    const postDate = cols[0];
    const rawAmount = cols[2];
    const isDebit = rawAmount.startsWith('-');
    const credit = isDebit ? "" : '$' + rawAmount;
    const debit = isDebit ? '$' + rawAmount.substring(1) : "";
    
    const custom = parseDescription(cols[1]);

    return [postDate, custom.rcvDate || "", custom.method, custom.ref, custom.counterparty || "TODO", credit, debit, custom.notes || ""];
}

window.onload = () => {
    document.getElementById("submit").addEventListener("click", () => {
        const input = document.getElementById("input").value;
        const lines = input.split(/\r?\n/);
        const parsedRows = [];
        
        for (let i = 0; i < lines.length; i++) {
            const line = lines[i].trim();
            if (line.length < 5 || line.includes('"DATE"')) continue;
            try {
                const cols = line.substring(1, line.length - 1).split('","');
                parsedRows.push(transformRow(cols));
            } catch (err) { console.error(err); }
        }
        
        const result = parsedRows
            .sort((a, b) => new Date(a[0]) - new Date(b[0]))
            .map(row => row.map(s => '"' + s + '"').join(','))
            .join("\n");
            
        document.getElementById("output").value = result;
    });
};
</script>
</html>
