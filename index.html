<html>
<style>
textarea {
    width: 800px;
    height: 400px;
    overflow-y: scroll;
    overflow: scroll;
    white-space: pre;
}
.button {
  background-color: #008cba; /* Green */
  border: none;
  color: white;
  padding: 15px 32px;
  text-align: center;
  text-decoration: none;
  display: inline-block;
  font-size: 16px;
  border-radius: 4px;
  user-select: none;
  cursor: pointer;
}
.error-box {
  display: none;
  background-color: #ffebee;
  border: 2px solid #ef5350;
  border-radius: 4px;
  padding: 15px;
  margin: 10px 0;
  color: #c62828;
  font-family: monospace;
  white-space: pre-wrap;
  max-width: 800px;
}
.error-box.visible {
  display: block;
}
</style>
<div>Enter Comma-delimited file content (goto the wells fargo account, then click "Download Account Activity", pick dates, and use Comma delimited):</div>
<textarea id="input"></textarea>
<br/>
<div id="submit" class="button">Transform</div>
<br/>
<div id="error" class="error-box"></div>
<div>Transformed content (copy this into CCF Transactions google sheet and then do "Data" -> "Split Text Into Columns"):</div>
<textarea id="output" readonly>
</textarea>
<script>
const capitalize = (str, lower = true) =>
    (lower ? str.toLowerCase() : str).replace(/(?:^|\s|["'([{])+\S/g, match => match.toUpperCase());

function parseZelle(tx) {
    // 1. Extract Ref: Look for any REF # followed by alphanumeric
    const refMatch = tx.match(/REF # ?([a-zA-Z0-9]+)/i);
    const ref = refMatch ? refMatch[1] : "";

    // 2. Extract Date: Look for ON MM/DD
    const onMatch = tx.match(/ ON (\d\d\/\d\d)/i);
    const rcvDate = onMatch ? onMatch[1] + '/' + new Date().getFullYear() : "";

    // 3. Extract Counterparty: 
    // Format is "ZELLE FROM/TO [NAME] ON..." 
    // We strip "ZELLE " and the direction, then take everything up until the "ON" or "REF"
    const dirMatch = tx.match(/ZELLE (FROM|TO) /i);
    const startIdx = dirMatch ? dirMatch.index + dirMatch[0].length : 6;
    const endIdx = onMatch ? onMatch.index : (refMatch ? refMatch.index : tx.length);
    
    const counterparty = capitalize(tx.substring(startIdx, endIdx).trim());

    // 4. Notes: Everything after the REF section
    let notes = "";
    if (refMatch) {
        notes = tx.substring(refMatch.index + refMatch[0].length).trim();
    }

    return { method: "zelle", ref, rcvDate, notes, counterparty };
}

function parseDescription(tx) {
    var lower = tx.toLowerCase();
    if (lower.startsWith("deposited or cashed check ") || lower.startsWith("check ")) {
        return { method: "check", ref: lower.split("check # ")[1] || "" };
    } else if (lower.startsWith("zelle ")) {
        return parseZelle(tx);
    } else if (lower.includes("tithe.ly")) {
        const parts = tx.split('*');
        return {
            method: "tithely",
            ref: parts.length > 1 ? parts[1].trim().split(' ')[0] : "UNKNOWN",
            counterparty: "PFP",
            notes: ""
        };
    } else {
        throw new Error("unknown transaction type: " + tx);
    }
}

function transformRow(cols) {
    // CSV Format: 0: Date, 1: Description, 2: Amount, 3: Check #, 4: Status
    const postDate = cols[0];
    const rawAmount = cols[2];
    
    const isDebit = rawAmount.startsWith('-');
    const credit = isDebit ? "" : '$' + rawAmount;
    const debit = isDebit ? '$' + rawAmount.substring(1) : "";
    
    const custom = parseDescription(cols[1]);

    return [
        postDate, 
        custom.rcvDate || "", 
        custom.method, 
        custom.ref, 
        custom.counterparty || "TODO", 
        credit, 
        debit, 
        custom.notes || ""
    ];
}

// Window logic remains same for processing
window.onload = () => {
    document.getElementById("submit").addEventListener("click", () => {
        const input = document.getElementById("input").value;
        const lines = input.split(/\r?\n/);
        const parsedRows = [];
        
        for (let i = 0; i < lines.length; i++) {
            const line = lines[i].trim();
            if (line.length < 5 || line.includes('"DATE"')) continue;
            
            const cols = line.substring(1, line.length - 1).split('","');
            parsedRows.push(transformRow(cols));
        }
        
        const result = parsedRows
            .sort((a, b) => new Date(a[0]) - new Date(b[0]))
            .map(row => row.map(s => '"' + s + '"').join(','))
            .join("\n");
            
        document.getElementById("output").value = result;
    });
};
</script>
</html>
